
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زفاف حلا وضاري</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eee7dc;
      color: #5b4936;
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 42px 24px;
      text-align: center;
      background: #fffdf7;
      border: 1px solid #c4a66a;
      outline: 5px solid #fffdf7;
      box-shadow: 0 12px 40px #75634b20;
      animation: appear 1.2s ease;
    }

    .top {
      font-size: 15px;
      color: #9d7b3c;
      line-height: 2;
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      margin: 28px 0 14px;
    }

    .names {
      font-size: 36px;
      color: #a58240;
      line-height: 1.8;
    }

    .heart {
      color: #b69a62;
      font-size: 24px;
    }

    p {
      line-height: 2;
    }

    .line {
      width: 65px;
      height: 1px;
      background: #c4a66a;
      margin: 22px auto;
    }

    .details {
      margin: 25px 0;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      background: #a58240;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      margin: 8px 4px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .small {
      font-size: 12px;
      color: #8b806e;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="top">
      بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ
    </div>

    <div class="line"></div>

    <p>بكل الحب والفرح، نتشرف بدعوتكم لمشاركتنا</p>

    <h1>فرحة العمر</h1>

    <div class="names">
      حلا <span class="heart">♥</span> ضاري
    </div>

    <p>بارك الله لنا وبارك علينا وجمع بيننا في خير</p>

    <div class="line"></div>

    <div class="details">
      <p>📅 التاريخ: يُحدد لاحقًا</p>
      <p>🕰️ الوقت: يُحدد لاحقًا</p>
      <p>📍 المكان: يُحدد لاحقًا</p>
    </div>

    <a
      class="button"
      href="https://maps.google.com/"
      target="_blank"
      rel="noopener"
    >
      موقع القاعة
    </a>

    <p class="small">
      حضوركم يزيد فرحتنا ويكمل سعادتنا ♥
    </p>

  </main>
</body>
</html>
